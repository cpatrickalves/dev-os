# Claude Code mods installed and uninstalled by scripts/manage-mods.sh.
#
# A mod is a plugin built from function hooks (live panes, bands, status
# lines, toasts) that changes the Claude Code UI. It installs like any other
# plugin, but is kept apart from external-plugins.yaml so it can be removed
# as easily as it is added.
#
# Fields:
#   name                plugin name (unique)
#   description         shown in the picker
#   marketplace         marketplace the mod is installed from (name@marketplace);
#                       `builtin` for a mod bundled with Claude Code, which is
#                       enabled/disabled instead of installed/uninstalled
#   marketplace_source  optional; `claude plugin marketplace add` argument for a
#                       marketplace that is not built in (GitHub owner/repo, URL
#                       or path). A relative path resolves against the Dev-OS root.
#                       When set, the marketplace is refreshed before each update.
#   scope               user | project | local
#   github              optional; GitHub URL of the mod, printed after install

mods:
  - name: savvy-progress
    description: Progress bar above the prompt and subagents panel
    marketplace: claude-kit
    marketplace_source: johnnyvizz/claude-kit
    scope: user
    github: https://github.com/JohnnyVizz/claude-kit

  - name: cc-plugin-you-should-know
    description: Side agent that surfaces things worth knowing above the prompt
    marketplace: builtin
    scope: user

  - name: filetree
    description: IDE-style file tree pane with git status and files Claude touches
    marketplace: claude-code-filetree
    marketplace_source: data-goblin/claude-code-filetree
    scope: user
    github: https://github.com/data-goblin/claude-code-filetree

  - name: reflect-mod
    description: Checks short prompts for corrections and saves rules from a band above the prompt
    marketplace: claude-reflect-marketplace
    marketplace_source: bayramannakov/claude-reflect
    scope: user
    github: https://github.com/BayramAnnakov/claude-reflect
