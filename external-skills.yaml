# External skill packages installed by scripts/install-external-skills.sh
# through `npx skills add` (idempotent: the same command installs and updates).
#
# Fields:
#   name         entry name (unique), shown in the picker
#   description  shown in the picker
#   source       package passed to `npx skills add` (GitHub owner/repo or URL)
#   skills       "*" for every skill in the package, or a comma-separated list
#   scope        project | global

skills:
  - name: langchain-skills
    description: LangChain, LangGraph and Deep Agents skills
    source: langchain-ai/langchain-skills
    skills: "*"
    scope: project

  - name: shadcn-ui
    description: shadcn/ui skills
    source: shadcn/ui
    skills: "*"
    scope: project

  - name: tlc-skills
    description: Tech Leads Club skills for planning and implementing features, discovery, design docs, threat modeling, decisions, PR review and demo videos
    source: tech-leads-club/agent-skills
    skills: tlc-plan, tlc-implement, tlc-discover, technical-design-doc-creator, security-threat-model, the-fool, the-judge, demo
    scope: global

  - name: tlc-playwright
    description: Tech Leads Club Playwright skill for browser automation and testing
    source: tech-leads-club/agent-skills
    skills: playwright-skill
    scope: project

  - name: mattpocock-skills
    description: Matt Pocock skills for domain modeling, design, debugging, planning, grilling and handoff (code-review is copied as matt-code-review)
    source: mattpocock/skills
    skills: domain-modeling, diagnosing-bugs, codebase-design, setup-ts-deep-modules, wayfinder, setup-matt-pocock-skills, retro, grill-me, grilling, grill-with-docs, handoff, writing-for-agents
    scope: global
